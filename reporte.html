<style>
/* ── RESET Y BASE ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

.cover-icon { font-size: 3.5rem; margin-bottom: 1rem; }

}
.lead strong { color: var(--ink); font-weight: 600; }
p { margin-bottom: 1rem; color: var(--text); line-height: 1.75; }

/* ── CITAS / FRASES CLAVE ── */
.quote-block {
  border-left: 4px solid var(--rose);

.highlight-label {

}
.highlight p { color: #5C4A00; margin: 0; font-size: 14px; }

/* ── WARNING BOX ── */
.warning {
  background: var(--warn-lt);
  border: 1px solid rgba(155,79,0,0.25);
  border-radius: 12px;
  padding: 1.2rem 1.4rem;

.warning-label { font-size: 10px; font-weight: 700; color: var(--warn); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
.warning p { color: #6B3600; margin: 0; font-size: 14px; }

  background: var(--green-lt);

  border-radius: 12px;
  padding: 1.2rem 1.4rem;
  margin: 1.4rem 0;
}
.insight-label { font-size: 10px; font-weight: 700; color: var(--green); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
.insight p { color: #1A4A30; margin: 0; font-size: 14px; }

/* ── LISTAS ── */
.check-list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin: 1rem 0; }
.check-list li { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--text); line-height: 1.55; }
.check-list li::before { content: '→'; color: var(--rose); flex-shrink: 0; font-weight: 700; margin-top: 1px; }
.check-list.green li::before { content: '✓'; color: var(--green); }
.check-list.warn li::before { content: '⚠'; color: var(--warn); font-style: normal; }

/* ── PERFIL CARD ── */
.profile-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 1.5rem;
}
.profile-card-header {
  background: linear-gradient(135deg, var(--ink) 0%, var(--ink2) 100%);
  padding: 1.4rem;
  display: flex;
  align-items: center;
  gap: 14px;
}
.profile-icon { font-size: 2.2rem; }
.profile-name { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: #fff; }
.profile-type { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; }
.profile-card-body { padding: 1.4rem; }

/* ── DINÂMICA VISUAL ── */
.dynamic-flow {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin: 1.2rem 0;
}
.flow-step {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 0;
  position: relative;
}
.flow-step:not(:last-child)::after {
  content: '';
  position: absolute;
  left: 14px; top: 38px;
  width: 2px; height: calc(100% - 14px);
  background: var(--border);
}
.flow-num {
  min-width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--rose-lt);
  border: 2px solid var(--rose);
  color: var(--rose-dk);
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; position: relative; z-index: 1;
}
.flow-text { font-size: 14px; color: var(--text); line-height: 1.55; padding-top: 2px; }

/* ── SCORE VISUAL ── */
.score-section {
  background: linear-gradient(135deg, var(--ink) 0%, var(--ink2) 100%);
  border-radius: 16px;
  padding: 2rem;
  text-align: center;
  margin: 1.5rem 0;
  color: #fff;
}
.score-ring-large {
  width: 100px; height: 100px;
  border-radius: 50%;
  background: rgba(200,75,106,0.15);
  border: 4px solid var(--rose);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  margin: 0 auto 1rem;
}
.score-big { font-size: 2.2rem; font-weight: 800; color: var(--rose); font-family: 'Playfair Display', serif; line-height: 1; }
.score-sublabel { font-size: 9px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.06em; }

/* ── BARRAS DE INTENSIDAD ── */
.bar-group { margin: 1rem 0; }
.bar-item { margin-bottom: 10px; }
.bar-label-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.bar-bg { height: 8px; background: #EDE9E3; border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; }
.bar-rose { background: linear-gradient(90deg, var(--rose), var(--rose-mid)); }
.bar-gold { background: linear-gradient(90deg, var(--gold), #e8b84a); }
.bar-green { background: linear-gradient(90deg, var(--green), #4CAF50); }

/* ── TABLA DE SEÑALES ── */
.signals-table {
  width: 100%;
  border-collapse: collapse;
  margin: 1rem 0;
  font-size: 13px;
}
.signals-table th {
  background: var(--ink);
  color: #fff;
  padding: 10px 14px;
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.signals-table th:first-child { border-radius: 8px 0 0 0; }
.signals-table th:last-child { border-radius: 0 8px 0 0; }
.signals-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text); line-height: 1.5; }
.signals-table tr:last-child td { border-bottom: none; }
.signals-table tr:nth-child(even) td { background: #FAFAF7; }

/* ── SEPARADOR ── */
.divider { height: 1px; background: var(--border); margin: 2rem 0; }
.divider-rose { height: 2px; background: linear-gradient(90deg, var(--rose), transparent); margin: 2rem 0; }

/* ── VEREDICTO FINAL ── */
.verdict-section {
  background: linear-gradient(135deg, var(--ink) 0%, #2D1A35 100%);
  border-radius: 20px;
  padding: 2.5rem;
  color: #fff;
  margin: 2rem 0;
  page-break-inside: avoid;
}
.verdict-label { font-size: 10px; color: rgba(255,255,255,0.4); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.75rem; }
.verdict-name { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--rose-mid); font-style: italic; margin-bottom: 1rem; }
.verdict-desc { font-size: 15px; color: rgba(255,255,255,0.75); line-height: 1.75; margin-bottom: 1.5rem; }
.verdict-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 520px) { .verdict-grid { grid-template-columns: 1fr; } }
.vg-box { border-radius: 12px; padding: 1rem; }
.vg-bad { background: rgba(200,75,106,0.12); border: 1px solid rgba(200,75,106,0.25); }
.vg-good { background: rgba(58,180,122,0.1); border: 1px solid rgba(58,180,122,0.25); }
.vg-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
.vg-bad .vg-label { color: var(--rose-mid); }
.vg-good .vg-label { color: #3AB47A; }
.vg-text { font-size: 13px; color: rgba(255,255,255,0.65); line-height: 1.6; }

/* ── PLAN DE ACCIÓN ── */
.plan-section { page-break-before: always; }
.plan-step {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.3rem;
  margin-bottom: 1rem;
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.plan-num {
  min-width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--rose);
  color: #fff;
  font-size: 15px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.plan-title { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.plan-desc { font-size: 13px; color: var(--muted); line-height: 1.6; }
.plan-week { font-size: 10px; font-weight: 700; color: var(--rose); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }

/* ── CIERRE ── */
.closing {
  background: var(--rose-lt);
  border-radius: 16px;
  padding: 2rem;
  text-align: center;
  margin-top: 2rem;
  border: 1px solid rgba(200,75,106,0.15);
}
.closing-icon { font-size: 2rem; margin-bottom: 0.75rem; }
.closing h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--rose-dk); margin-bottom: 0.75rem; }
.closing p { font-size: 13px; color: var(--rose-dk); line-height: 1.7; max-width: 440px; margin: 0 auto; opacity: 0.8; }

/* ── PRINT ── */
@media print {
  .no-print { display: none !important; }
  body { font-size: 13px; }
  .cover { min-height: auto; padding: 4cm 3cm; }
  .section { page-break-inside: avoid; }
  .verdict-section { page-break-inside: avoid; }
  .plan-section { page-break-before: always; }
}

/* ── SELECTOR (solo para demo) ── */
.demo-selector {
  position: fixed;
  top: 1rem; right: 1rem;
  background: var(--ink);

  padding: 1rem;
  z-index: 100;

  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.demo-selector h4 { font-size: 12px; color: #fff; margin-bottom: 8px; }
.demo-selector select {
  width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  color: #fff; border-radius: 8px; padding: 8px; font-size: 12px;
  font-family: 'DM Sans', sans-serif; margin-bottom: 6px; cursor: pointer;
}
.demo-selector button {
  width: 100%; background: var(--rose); border: none; color: #fff;
  border-radius: 8px; padding: 8px; font-size: 12px; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-weight: 600;
}
</style>

<script>
/* ═══════════════════════════════════════════════════════════
   BASE DE DATOS CLÍNICA — 4 perfiles ella × 4 perfiles él
   Redactada como terapeuta de relaciones real
   ═══════════════════════════════════════════════════════════ */

const ELLA = [
  /* ────────────────────────────────
     PERFIL 0: LA REPARADORA
  ──────────────────────────────── */
  {
    icon: "🌹",
    tipo: "La Reparadora",
    etiqueta: "Cuidado compulsivo · Apego ansioso",
    resumen: "Amor que cura al otro... y agota a quien lo da.",
    intro: `Hay algo en ti que se activa casi de forma automática cuando alguien sufre frente a tus ojos. No es solo empatía — es una llamada interna que dice: <em>"yo puedo arreglar esto"</em>. Esa capacidad de ver el dolor ajeno y querer hacer algo con él es genuinamente hermosa. El problema no está en que cuides. El problema está en que necesitas curar para sentirte valiosa en una relación.`,
    descripcion_profunda: `Probablemente aprendiste desde pequeña que el amor se gana siendo útil. Tal vez había alguien en tu casa cuyas emociones dependían de ti — un padre inestable, una madre que necesitaba apoyo, una dinámica familiar donde tú eras el ancla. Sin darte cuenta, internalizaste la creencia de que tu valor como persona está ligado a cuánto puedes hacer por los demás.

Eso te convierte en una pareja extraordinariamente atenta, generosa y capaz de una intimidad profunda. Pero también te hace vulnerable a un tipo específico de hombre: el que tiene heridas visibles, el que muestra su vulnerabilidad, el que parece necesitar que alguien lo salve. Para ti, ese hombre no es una señal de peligro — es una invitación.`,
    patron_cognitivo: `Tu mente opera bajo una lógica que se parece a esto: "Si lo entiendo lo suficiente, si soy paciente, si lo amo bien, él va a cambiar." Es una esperanza genuina, pero también es una trampa. Porque el cambio emocional de una persona adulta no es responsabilidad de quien lo ama — es responsabilidad propia.

Cada vez que él "mejora" un poco, tu cerebro lo registra como evidencia de que tu estrategia funciona. Y cada vez que recae, en lugar de cuestionarlo a él, te cuestionas a ti: ¿qué hice mal?, ¿cómo puedo hacerlo mejor?`,
    senales: [
      "Sientes que 'nadie lo entendería como yo'",
      "Te cuesta mucho poner límites por miedo a herirlo",
      "Sus problemas ocupan más espacio mental que los tuyos",
      "Te sientes culpable cuando priorizas tus propias necesidades",
      "La relación se siente más como un proyecto que como un vínculo",
      "Cuando él está bien, tú estás bien — y cuando él está mal, tú también"
    ],

   FUNCIÓN PRINCIPAL: generarReporte(iElla, sEl)
   ═══════════════════════════════════════════════
   En producción, esta función recibe los datos
   del quiz y genera el HTML del reporte completo.
   En el selector demo, se llama con los valores
   de los selects.
═══════════════════════════════════════════════ */
function leerURLYGenerar() {
  var params = new URLSearchParams(window.location.search);
  var r      = params.get('r');
  var status = params.get('status');

  /* ── Hotmart / Kiwify / Stripe — parámetros de retorno ──
     Hotmart  → ?status=approved  o  ?status=paid
     Kiwify   → ?status=paid
     Stripe   → ?status=complete  o  ?payment_status=paid   */
  var compraAprobada = (
    status === 'paid'      ||
    status === 'approved'  ||
    status === 'completed' ||
    status === 'complete'  ||
    params.get('payment_status') === 'paid'
  );

  /* ── Lee los resultados del quiz desde el parámetro ?r= ── */
  if (r && compraAprobada) {
    try {
      var datos = JSON.parse(atob(decodeURIComponent(r)));
      if (datos.ella !== undefined && datos.el) {
        /* Oculta el selector demo */
        var demo = document.querySelector('.demo-selector');
        if (demo) demo.style.display = 'none';
        generarReporte(datos.ella, datos.el);
        return;
      }
    } catch(e) {
      console.warn('No se pudieron leer los datos del quiz:', e);
    }
  }

  /* ── Si hay ?r= pero sin status (testing directo) ── */
  if (r) {
    try {
      var datos2 = JSON.parse(atob(decodeURIComponent(r)));
      if (datos2.ella !== undefined && datos2.el) {
        var demo2 = document.querySelector('.demo-selector');
        if (demo2) demo2.style.display = 'none';
        generarReporte(datos2.ella, datos2.el);
        return;
      }
    } catch(e) {}
  }

  /* ── Modo demo: usa los selects ── */
  var iElla = parseInt(document.getElementById('sel-ella').value);
  var sEl   = document.getElementById('sel-el').value;
  generarReporte(iElla, sEl);
}

function generarReporte(iEllaParam, sElParam) {
  var iElla = (iEllaParam !== undefined) ? iEllaParam : parseInt(document.getElementById('sel-ella').value);
  var sEl   = (sElParam   !== undefined) ? sElParam   : document.getElementById('sel-el').value;
  var key   = iElla + '-' + sEl;

  var ella  = ELLA[iElla];
  var el    = EL[sEl];
  var din   = DIN[key] || { nombre:"Dinámica Compleja", score:50,
    desc:"La combinación de sus perfiles crea una dinámica única.",
    ciclo:[], quimica:"", desgaste:[], verdict:"Pendiente de análisis",
    v_desc:"", bad:"", good:"",
    plan:[{sem:"Semana 1-8",titulo:"Acompañamiento personalizado",desc:"Esta combinación requiere análisis más profundo."}] };

  document.getElementById('reporte-root').innerHTML = construirHTML(ella, el, din);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
